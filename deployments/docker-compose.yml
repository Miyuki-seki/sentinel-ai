services:
  mock-target-1:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.target
    ports:
      - "8081:8081"

  mock-target-2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.target
    ports:
      - "8082:8081"

  monitor:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.monitor
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - TARGET_URLS=${TARGET_URLS:-http://mock-target-1:8081/health,http://mock-target-2:8081/health}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - CHECK_INTERVAL_SEC=${CHECK_INTERVAL_SEC:-5}
      - PORT=${PORT:-8080}
      - DB_PATH=${DB_PATH:-/app/data/sentinel.db}
      - PROBE_LOG_RETENTION_HOURS=${PROBE_LOG_RETENTION_HOURS:-24}
      - INCIDENT_RETENTION_DAYS=${INCIDENT_RETENTION_DAYS:-30}
      - CLEANUP_INTERVAL_MIN=${CLEANUP_INTERVAL_MIN:-60}
    volumes:
      - ../data:/app/data
    depends_on:
      - mock-target-1
      - mock-target-2
